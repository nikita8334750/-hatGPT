[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-ts-audio-fix"
version = "0.1.0"
description = "CLI для подготовки совместимых MPEG-TS файлов для автомагнитол"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex"}]
dependencies = []

[project.scripts]
car-ts-audio-fix = "car_ts_audio_fix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
