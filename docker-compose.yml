version: "3.9"

services:
  app:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  scheduler:
    build: .
    command: ["python", "-m", "app.services.scheduler.worker"]
    env_file: .env
    depends_on:
      - redis

  rq-worker:
    build: .
    command: ["python", "-m", "app.services.scheduler.rq_worker"]
    env_file: .env
    depends_on:
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
